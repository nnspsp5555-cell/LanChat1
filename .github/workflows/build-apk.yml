name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Unzip project
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f" -x ".github/*"
          done

      - name: Fix missing app icon
        run: |
          sed -i 's#@mipmap/ic_launcher_round#@android:drawable/sym_def_app_icon#g; s#@mipmap/ic_launcher#@android:drawable/sym_def_app_icon#g' LanChat/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd LanChat
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LanChat-APK
          path: LanChat/app/build/outputs/apk/debug/*.apk
