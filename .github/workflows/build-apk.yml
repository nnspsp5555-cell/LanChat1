name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Unzip project
        run: |
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f" -x ".github/*"
          done

      - name: Build APK
        run: |
          cd LanChat
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LanChat-APK
          path: LanChat/app/build/outputs/apk/debug/*.apk
